# All paths relative to project root
# Usage: with open("config/paths.yaml") as f: paths = yaml.safe_load(f)

# Top-level data directories
raw_data: data/raw
interim_data: data/interim
processed_data: data/processed

# Output directories
models: data/processed/models
figures: reports/figures
logs: logs

# Phase-specific outputs
canonical: data/processed/canonical
features: data/processed/features
graph: data/processed/graph

# Raw data sources (organized by dataset)
raw_usda: data/raw/usda
raw_wikidata: data/raw/wikidata
raw_pubchem: data/raw/pubchem
raw_foodb: data/raw/foodb
raw_flavordb: data/raw/flavordb

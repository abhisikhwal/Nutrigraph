[pytest]
# Pytest configuration for Global Food-Genome project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_rdkit: marks tests that require RDKit
    requires_data: marks tests that require downloaded data

# Coverage options (if using pytest-cov)
# addopts = --cov=src --cov-report=html --cov-report=term

# Ignore patterns
norecursedirs = .git .tox dist build *.egg data notebooks
